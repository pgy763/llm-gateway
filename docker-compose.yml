services:
  postgres:
    image: postgres:16-alpine
    container_name: llmgateway-postgres
    environment:
      POSTGRES_DB: llmgateway
      POSTGRES_USER: llmgateway
      POSTGRES_PASSWORD: llmgateway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U llmgateway -d llmgateway" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: llmgateway-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
